[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Required environment variables: DATABASE_URL (Railway Postgres plugin),
# AUTH_SERVICE_URL, CLASSIFICATION_SERVICE_URL (Railway private networking
# URLs for the sibling services), S3_ENDPOINT_URL/S3_ACCESS_KEY/
# S3_SECRET_KEY/S3_BUCKET (your S3-compatible provider), MQTT_BROKER_HOST,
# MQTT_PASSWD_FILE_PATH (a volume shared with mqtt-broker -- see
# ../../docs/deployment-railway.md for how Railway volumes are attached
# across services).
