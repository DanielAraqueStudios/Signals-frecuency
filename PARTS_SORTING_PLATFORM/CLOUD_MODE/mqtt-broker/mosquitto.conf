# Eclipse Mosquitto config for the parts-sorting platform.
#
# TLS-only: there is deliberately no plaintext listener. Every client
# (classification-service, the ESP32-S3 firmware, the phone app's live
# view) connects over MQTTS.
#
# Cert paths below assume certs/ is mounted at /mosquitto/certs (see
# Dockerfile and docs/deployment-railway.md for how that volume/secret is
# populated in production, and scripts/gen-dev-certs.sh for local dev).

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2

# A second listener for browser clients (the phone app's live-result view)
# that need MQTT over WebSockets rather than raw TCP.
listener 8884
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
