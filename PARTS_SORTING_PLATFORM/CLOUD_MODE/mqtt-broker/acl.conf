# Per-device topic ACLs.
#
# Topic scheme: results/<mqttUsername>, where <mqttUsername> is exactly
# the device's own MQTT username (api-gateway's POST /devices/pair mints
# each paired ESP32-S3 a globally-unique username of the form
# "device-<deviceId>" plus a random password -- see
# mqtt-broker/certs/README.md). %u below expands to that same username, so
# a device can only ever read the topic that already equals its own
# login -- there is no way for one device to construct another device's
# topic string.
#
# Note this ACL does NOT embed userId anywhere: which user owns which
# deviceId is tracked in api-gateway's own database (a devices table), not
# in the MQTT topic. That's deliberate -- topic strings are a weak place
# to enforce cross-user authorization (any client can guess/enumerate
# them), so ownership is checked server-side in api-gateway before a
# device is ever paired or a result is published.

# classification-service: looks up which device a classification run was
# requested for (via api-gateway) and publishes there. It never reads
# anything back (it's a fire-and-forget publisher here; the actual image
# bytes travel over HTTPS via api-gateway, not MQTT -- see
# docs/architecture.md).
user classification-service
topic write results/#

# Each ESP32-S3 device: read-only on the one topic matching its own
# username.
pattern read results/%u/#

# Reserved for a future actuation feature (explicitly out of scope for
# now -- see PARTS_SORTING_PLATFORM/readme.md): a device could subscribe
# to commands/%u/# once a sorting mechanism exists to act on it.
pattern read commands/%u/#
