[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Required environment variables (set in the Railway service settings, never
# committed here): MQTT_BROKER_HOST, MQTT_BROKER_PORT, MQTT_CA_CERT (PEM
# contents or a path -- see app/mqtt_publisher.py), MQTT_USERNAME,
# MQTT_PASSWORD (this service's own device-style MQTT credential, minted
# the same way ../../mqtt-broker/README.md describes for ESP32 devices).
# See ../../docs/deployment-railway.md for how api-gateway reaches this
# service over Railway's private networking.
